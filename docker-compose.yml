# Ambient Guard — Docker Compose baseline (M0).
# Dedicated project name + non-standard HOST ports so it does not collide with the
# ~10 containers already running on the `meow` server. nginx (already on the host)
# reverse-proxies the public route to backend's host port. See docs/RISK_REGISTER.md R6.
name: ambient-guard

services:
  backend:
    build: ./backend
    environment:
      AMBIENT_GUARD_BEE_MODE: ${AMBIENT_GUARD_BEE_MODE:-mock}
      # For mcp mode: the host runs `bee mcp serve-http` on 127.0.0.1:8790.
      # From the container, reach it via the host gateway (see extra_hosts below).
      AMBIENT_GUARD_BEE_MCP_URL: ${AMBIENT_GUARD_BEE_MCP_URL:-http://host.docker.internal:8790/mcp}
      AMBIENT_GUARD_BEE_HTTP_TOKEN: ${AMBIENT_GUARD_BEE_HTTP_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://ambient:ambient@db:5432/ambient_guard}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:18080:8080"  # localhost only — nginx is the sole public entry (see docs/RISK_REGISTER.md R6)
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ambient}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ambient}
      POSTGRES_DB: ${POSTGRES_DB:-ambient_guard}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ambient}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # frontend service added in M6.

volumes:
  pgdata:
