# Ambient Guard — Docker Compose.
# Dedicated project name + non-standard HOST port so it does not collide with the
# ~10 containers already running on the `meow` server. Public route is fronted by a
# Cloudflare Tunnel -> 127.0.0.1:18080 (see docs/DEPLOYMENT.md). See RISK_REGISTER R6.
#
# G7: PostgreSQL added for guard persistence with explicit 7-day retention policy.
name: ambient-guard

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ambientguard
      POSTGRES_PASSWORD: ${AMBIENT_GUARD_DB_PASSWORD:-ambientguard}
      POSTGRES_DB: ambientguard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ambientguard"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      AMBIENT_GUARD_BEE_MODE: ${AMBIENT_GUARD_BEE_MODE:-mock}
      # For mcp mode: the host runs `bee mcp serve-http` on 127.0.0.1:8790.
      # From the container, reach it via the host gateway (see extra_hosts below).
      AMBIENT_GUARD_BEE_MCP_URL: ${AMBIENT_GUARD_BEE_MCP_URL:-http://host.docker.internal:8790/mcp}
      AMBIENT_GUARD_BEE_HTTP_TOKEN: ${AMBIENT_GUARD_BEE_HTTP_TOKEN:-}
      # R3 fallback location used when Bee's current location is stale (is_recent=false).
      AMBIENT_GUARD_DEFAULT_LOCATION: ${AMBIENT_GUARD_DEFAULT_LOCATION:-}
      # CORS allow-list (M7); comma-separated. Omit to use the code default.
      AMBIENT_GUARD_CORS_ORIGINS: ${AMBIENT_GUARD_CORS_ORIGINS:-}
      # G7: Database connection for guard persistence
      AMBIENT_GUARD_DATABASE_URL: postgresql://ambientguard:${AMBIENT_GUARD_DB_PASSWORD:-ambientguard}@db:5432/ambientguard
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:18080:8080"  # localhost only — Cloudflare Tunnel is the public entry
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  pgdata:
