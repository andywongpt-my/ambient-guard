# Ambient Guard — nginx reverse proxy (meow server)
# Fronts the compose backend bound to 127.0.0.1:18080.
# Install:  sudo cp deploy/nginx/ambient-guard.conf /etc/nginx/conf.d/
#           sudo nginx -t && sudo systemctl reload nginx
#
# Choose ONE listen strategy:
#   (a) dedicated port (like the existing vaultwarden.conf on :8082), or
#   (b) a server_name vhost on :80/:443 with TLS (recommended for the public demo).
# Template below uses a dedicated port; swap in server_name + TLS as needed.

server {
    listen 18090;                      # public port; pick one that is free on the host
    server_name _;

    # Optional: HTTPS — terminate TLS here and point to your certs.
    # listen 443 ssl;
    # ssl_certificate     /etc/letsencrypt/live/<host>/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/<host>/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
