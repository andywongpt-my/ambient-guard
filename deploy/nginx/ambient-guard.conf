# Ambient Guard — nginx reverse proxy for bee.andywongpt.com (meow server)
# Fronts the compose backend bound to 127.0.0.1:18080.
#
# PREREQUISITES (do these first):
#   1. DNS: add an A record  bee.andywongpt.com -> 60.53.214.8
#      (and/or AAAA -> 2001:e68:540e:1523:6a1d:efff:fe4f:c0d5). Verify: dig +short bee.andywongpt.com
#   2. Ports 80 AND 443 must be reachable from the public internet to this host
#      (router/firewall port-forward). If this is a home/CGNAT IP, use a Cloudflare
#      Tunnel instead — see docs/DEPLOYMENT.md.
#
# INSTALL (run yourself; do NOT share the sudo password):
#   sudo cp deploy/nginx/ambient-guard.conf /etc/nginx/conf.d/ambient-guard.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   # then issue the cert (installs the ssl_certificate lines automatically):
#   sudo dnf install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d bee.andywongpt.com --redirect -m you@andywongpt.com --agree-tos -n
#   sudo systemctl reload nginx

# --- HTTP: serves ACME challenge, redirects everything else to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name bee.andywongpt.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# --- HTTPS: reverse proxy to the app. certbot fills in the ssl_certificate lines. ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bee.andywongpt.com;

    # certbot --nginx will insert:
    #   ssl_certificate     /etc/letsencrypt/live/bee.andywongpt.com/fullchain.pem;
    #   ssl_certificate_key /etc/letsencrypt/live/bee.andywongpt.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
