<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ambient Guard — Personal Environmental Agent</title>
<style>
  :root {
    --bg:#0e1116; --panel:#171b22; --border:#262c36; --fg:#e6e9ef; --muted:#9aa4b2;
    --accent:#5db0ff; --warn:#ff6b6b; --caution:#ffb454; --ok:#4ec98f;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { padding:20px 24px; border-bottom:1px solid var(--border); display:flex;
           align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  h1 { font-size:20px; margin:0; } h1 span { color:var(--accent); }
  .tag { color:var(--muted); font-size:13px; }
  main { max-width:960px; margin:0 auto; padding:20px 24px 60px; }
  .row { display:flex; gap:16px; flex-wrap:wrap; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:12px;
           padding:16px 18px; margin-bottom:16px; flex:1; min-width:280px; }
  .panel h2 { font-size:12px; letter-spacing:.08em; text-transform:uppercase;
              color:var(--muted); margin:0 0 10px; }
  .big { font-size:18px; font-weight:600; }
  .metrics { display:flex; gap:14px; flex-wrap:wrap; }
  .metric { background:#0e1116; border:1px solid var(--border); border-radius:10px;
            padding:10px 14px; min-width:96px; }
  .metric .v { font-size:22px; font-weight:700; } .metric .l { color:var(--muted); font-size:12px; }
  .rec { border-left:4px solid var(--accent); }
  .rec.warning { border-color:var(--warn); } .rec.caution { border-color:var(--caution); }
  .rec.info { border-color:var(--ok); }
  ul.ev { list-style:none; padding:0; margin:0; }
  ul.ev li { padding:8px 0; border-bottom:1px solid var(--border); }
  ul.ev li:last-child { border-bottom:0; }
  .pill { display:inline-block; font-size:11px; padding:1px 8px; border-radius:999px;
          margin-right:8px; text-transform:uppercase; letter-spacing:.05em; }
  .pill.warning { background:#3a1414; color:var(--warn); }
  .pill.caution { background:#3a2a10; color:var(--caution); }
  .pill.info { background:#0f2b1f; color:var(--ok); }
  .src { color:var(--muted); font-size:12px; }
  button { background:var(--accent); color:#04101f; border:0; border-radius:8px;
           padding:9px 16px; font-weight:600; cursor:pointer; }
  input { background:#0e1116; border:1px solid var(--border); color:var(--fg);
          border-radius:8px; padding:8px 10px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:600; }
  .note { color:var(--muted); font-size:12px; margin-top:6px; }
  .err { color:var(--warn); }
</style>
</head>
<body>
<header>
  <h1>Ambient<span>Guard</span> <span class="tag">— Personal Environmental Agent powered by Bee</span></h1>
  <div class="row" style="align-items:center">
    <input id="intent" placeholder="Override intent (e.g. jog at 5 PM)" size="26" />
    <button id="run">Assess</button>
  </div>
</header>
<main>
  <div id="status" class="note">Loading assessment…</div>

  <!-- 1. Bee context -->
  <div class="panel">
    <h2>1 · Bee-derived personal context</h2>
    <div id="ctx"></div>
  </div>

  <div class="row">
    <!-- 2. Conditions -->
    <div class="panel">
      <h2>2 · Environmental conditions</h2>
      <div id="conditions" class="metrics"></div>
    </div>
  </div>

  <!-- 3. Recommendation -->
  <div id="rec" class="panel rec">
    <h2>3 · Ambient Guard recommendation</h2>
    <div id="rectext" class="big"></div>
    <div id="recsummary" class="note"></div>
  </div>

  <!-- 4. Evidence -->
  <div class="panel">
    <h2>4 · Evidence</h2>
    <ul id="evidence" class="ev"></ul>
  </div>

  <!-- 5. Timeline -->
  <div class="panel">
    <h2>5 · Environmental timeline</h2>
    <table id="timeline"><thead><tr>
      <th>Time</th><th>Kind</th><th>AQI</th><th>UV</th><th>Temp °C</th><th>PM2.5</th>
    </tr></thead><tbody></tbody></table>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const API = ""; // same origin

function fmt(v, s="") { return (v===null||v===undefined) ? "—" : (Math.round(v*10)/10)+s; }
function timeShort(iso){ try { return new Date(iso).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); } catch { return iso; } }

async function assess() {
  $("status").textContent = "Running assessment…";
  $("status").className = "note";
  const body = {};
  const ov = $("intent").value.trim();
  if (ov) body.intent_override = ov;
  let data;
  try {
    const r = await fetch(API + "/api/v1/assess", {
      method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)
    });
    data = await r.json();
    if (!r.ok) throw new Error(data.detail || ("HTTP "+r.status));
  } catch (e) {
    $("status").textContent = "Assessment failed: " + e.message;
    $("status").className = "note err";
    return;
  }
  const a = data.assessment;
  $("status").textContent = "Bee mode: " + data.bee_mode + " · assessed " + timeShort(a.recommendation.timestamps.assessed_at);

  // 1. context
  const c = a.context;
  $("ctx").innerHTML =
    `<div class="big">${c.intent_text || "(no intent-bearing Bee context)"}</div>
     <div class="note">activity: <b>${c.activity ?? "—"}</b> · planned: <b>${c.planned_time?timeShort(c.planned_time):"—"}</b>
       · location: <b>${c.location ?? "—"}</b> · confidence: <b>${fmt(c.confidence)}</b></div>
     <div class="src">source: ${c.source_ref.provider} (ref ${c.source_ref.ref_id ?? "?"}) · recent-location: ${c.location_is_recent}</div>`;

  // 2. conditions
  const byMetric = {}; a.observations.forEach(o => byMetric[o.metric] = o);
  const want = [["aqi","AQI"],["pm25","PM2.5"],["uv","UV"],["temp_c","Temp °C"],["humidity","Humidity %"]];
  $("conditions").innerHTML = want.map(([m,l]) => {
    const o = byMetric[m];
    return `<div class="metric"><div class="v">${o?fmt(o.value):"—"}</div><div class="l">${l}</div></div>`;
  }).join("");

  // 3. recommendation
  const worst = a.recommendation.evidence.reduce((w,e)=>({info:0,caution:1,warning:2}[e.severity]>{info:0,caution:1,warning:2}[w]?e.severity:w),"info");
  $("rec").className = "panel rec " + worst;
  $("rectext").textContent = a.recommendation.text;
  $("recsummary").textContent = a.recommendation.reasoning_summary + " · confidence " + fmt(a.recommendation.confidence);

  // 4. evidence
  $("evidence").innerHTML = a.recommendation.evidence.map(e =>
    `<li><span class="pill ${e.severity}">${e.severity}</span>${e.note}
       <span class="src">— ${e.observation.metric} ${fmt(e.observation.value)} ${e.observation.unit}
       (${e.observation.kind}, ${e.observation.source.provider})</span></li>`).join("");

  // 5. timeline (needs coords)
  if (c.latitude != null && c.longitude != null) loadTimeline(c.latitude, c.longitude);
  else $("#timeline tbody") && ($("timeline").querySelector("tbody").innerHTML =
    `<tr><td colspan="6" class="note">No coordinates available for timeline.</td></tr>`);
}

async function loadTimeline(lat, lon) {
  try {
    const r = await fetch(`${API}/api/v1/timeline?lat=${lat}&lon=${lon}&hours=6`);
    const d = await r.json();
    $("timeline").querySelector("tbody").innerHTML = d.entries.map(e =>
      `<tr><td>${timeShort(e.time)}</td><td>${e.kind}</td><td>${fmt(e.aqi)}</td>
        <td>${fmt(e.uv)}</td><td>${fmt(e.temp_c)}</td><td>${fmt(e.pm25)}</td></tr>`).join("");
  } catch (e) {
    $("timeline").querySelector("tbody").innerHTML =
      `<tr><td colspan="6" class="err">Timeline failed: ${e.message}</td></tr>`;
  }
}

$("run").addEventListener("click", assess);
$("intent").addEventListener("keydown", (e)=>{ if(e.key==="Enter") assess(); });
assess();
</script>
</body>
</html>
